version: "3.9"

services:
  flighttracker:
    build: .
    container_name: flighttracker-cv
    restart: unless-stopped

    # GPU access (requires NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "5000:5000"       # Web dashboard → open http://localhost:5000

    volumes:
      # Trained detector weights (must exist on host before running)
      - ./weights/best.pt:/app/weights/detector/best.pt:ro

      # Persistent logs and screenshots
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots

      # Optional: mount test videos
      - ./test_videos:/app/test_videos:ro

    environment:
      - PYTHONUNBUFFERED=1

    # Webcam passthrough (Linux host only)
    # Uncomment the lines below to enable live camera:
    # devices:
    #   - /dev/video0:/dev/video0

    # Run: web dashboard only (no OpenCV window)
    command: ["--no-window", "--web"]

    # To test with a video file instead:
    # command: ["--source", "/app/test_videos/test_video.mp4", "--no-window", "--web"]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
